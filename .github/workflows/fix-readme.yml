name: Fix README

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse - readme only)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            README.md
          sparse-checkout-cone-mode: false

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Rebuild README from JSON metadata
        run: |
          python3 -c '
          import os
          import json
          import glob

          header = "# Wallpaper Archive\n\nAutomated archive of wallpapers to bypass Cloudflare and prevent dead links.\n\n## Gallery\n\n| Preview | Title | Tags |\n| --- | --- | --- |\n"
          
          rows = []
          count = 0
          for json_file in glob.glob("assets/*.json"):
              with open(json_file, "r", encoding="utf-8") as f:
                  try:
                      item = json.load(f)
                      # determine extension
                      ext = "png" if ".png" in item.get("download_url", "") else "jpg"
                      item_id = item.get("id", "")
                      filename = f"{item_id}.{ext}"
                      cdn_url = f"https://cdn.colorwall.xyz/{filename}"
                      
                      title = item.get("title", "Wallpaper")
                      tags = ", ".join(item.get("tags", []))
                      
                      row = f"| <img src=\"{cdn_url}\" width=\"200\"> | **{title}**<br>[Download]({cdn_url}) | {tags} |\n"
                      rows.append((item.get("id", ""), row))
                      count += 1
                  except Exception as e:
                      pass
          
          # sort alphabetically by id to keep it consistent
          rows.sort(key=lambda x: x[0])
          
          with open("README.md", "w", encoding="utf-8") as f:
              f.write(header)
              for _, row in rows:
                  f.write(row)
                  
          print(f"Rebuilt README with {count} wallpapers!")
          '

      - name: Commit and Push
        run: |
          git add --sparse README.md
          git diff --cached --quiet && echo "no changes" || (git commit -m "fix: perfectly rebuild readme from archive metadata [skip ci]" && git push)
